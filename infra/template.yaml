AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Caddie Coach MCP server (Streamable HTTP, spec 2025-11-25) on AWS Lambda behind an
  HTTPS Function URL, with per-user state in DynamoDB and spoken recaps from Bedrock.

Parameters:
  BedrockModelId:
    Type: String
    Default: ""
    Description: >
      Bedrock model ID for the spoken round recap (e.g. us.anthropic.claude-3-5-haiku-20241022-v1:0).
      Leave empty to use the built-in templated recap and skip Bedrock entirely.

Globals:
  Function:
    Timeout: 30
    MemorySize: 512

Resources:
  CaddieTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST # on-demand: no idle cost, stays in free tier at demo scale
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH

  CaddieFunction:
    Type: AWS::Serverless::Function
    Metadata:
      DockerContext: ../server
      Dockerfile: Dockerfile
      DockerTag: latest
    Properties:
      PackageType: Image
      Architectures:
        - arm64
      Environment:
        Variables:
          DDB_TABLE: !Ref CaddieTable
          BEDROCK_MODEL_ID: !Ref BedrockModelId
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CaddieTable
        - Statement:
            - Sid: BedrockInvoke
              Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: "*"
      FunctionUrlConfig:
        AuthType: NONE # Alexa+ supplies OAuth at the add-on layer; tighten to AWS_IAM for a private deploy
        InvokeMode: RESPONSE_STREAM # stream the MCP SSE responses instead of buffering

Outputs:
  McpEndpoint:
    Description: POST the MCP Streamable HTTP endpoint here (append /mcp)
    Value: !GetAtt CaddieFunctionUrl.FunctionUrl
  TableName:
    Description: DynamoDB table holding per-user golfer state
    Value: !Ref CaddieTable
