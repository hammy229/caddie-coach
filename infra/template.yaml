AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Caddie Coach MCP server (Streamable HTTP, spec 2025-11-25) on AWS Lambda behind an
  HTTPS Function URL, with per-user state in DynamoDB and spoken recaps from Bedrock.

Parameters:
  BedrockModelId:
    Type: String
    Default: ""
    Description: >
      Bedrock model ID for the spoken round recap (e.g. us.amazon.nova-micro-v1:0).
      Leave empty to use the built-in templated recap and skip Bedrock entirely.

  OAuthSigningSecret:
    Type: String
    NoEcho: true
    Default: ""
    Description: >
      Secret used to sign OAuth codes and tokens (32+ random characters). Leave empty to run
      without OAuth: /mcp then trusts the x-user-id header, for local testing only.
  OAuthClientId:
    Type: String
    Default: alexa-plus
    Description: OAuth client id the Alexa+ add-on is configured with.
  OAuthClientSecret:
    Type: String
    NoEcho: true
    Default: ""
    Description: OAuth client secret the Alexa+ add-on is configured with. Required when OAuthSigningSecret is set.
  OAuthRedirectUris:
    Type: String
    Default: ""
    Description: Comma-separated redirect URIs Alexa+ account linking may return to (shown in the add-on's account-linking settings).
  PublicBaseUrl:
    Type: String
    Default: ""
    Description: Public https origin of the Function URL, used as the OAuth issuer. Leave empty to derive it from each request.

Globals:
  Function:
    Timeout: 30
    MemorySize: 512

Resources:
  CaddieTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST # on-demand: no idle cost, stays in free tier at demo scale
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH

  CaddieFunction:
    Type: AWS::Serverless::Function
    Metadata:
      DockerContext: ../server
      Dockerfile: Dockerfile
      DockerTag: latest
    Properties:
      PackageType: Image
      Architectures:
        - arm64
      Environment:
        Variables:
          DDB_TABLE: !Ref CaddieTable
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          OAUTH_SIGNING_SECRET: !Ref OAuthSigningSecret
          OAUTH_CLIENT_ID: !Ref OAuthClientId
          OAUTH_CLIENT_SECRET: !Ref OAuthClientSecret
          OAUTH_REDIRECT_URIS: !Ref OAuthRedirectUris
          PUBLIC_BASE_URL: !Ref PublicBaseUrl
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CaddieTable
        - Statement:
            - Sid: BedrockInvoke
              Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: "*"
      FunctionUrlConfig:
        AuthType: NONE # Alexa+ supplies OAuth at the add-on layer; tighten to AWS_IAM for a private deploy
        InvokeMode: RESPONSE_STREAM # stream the MCP SSE responses instead of buffering

Outputs:
  McpEndpoint:
    Description: POST the MCP Streamable HTTP endpoint here (append /mcp)
    Value: !GetAtt CaddieFunctionUrl.FunctionUrl
  TableName:
    Description: DynamoDB table holding per-user golfer state
    Value: !Ref CaddieTable
